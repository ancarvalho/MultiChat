<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.jsdelivr.net/npm/pusher-js@8.3.0/dist/web/pusher.min.js"></script><link rel="icon" href="assets/logo.svg" type="image/svg+xml"><title>Multi-Platform Chat</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#a970ff"><link rel="apple-touch-icon" href="assets/logo.svg" type="image/svg+xml"><link rel="stylesheet" href="static/style.min.css"></head><body class="theme-dark"><header class="header"><div class="add-chat-container"><input type="text" id="chat-url-input" data-i18n-placeholder="addChatUrlPlaceholder" placeholder="Enter Twitch, Kick, or YouTube chat URL..."> <button id="add-chat-btn" data-i18n="addChatButton">Add Chat</button></div></header><main class="main-content-wrapper"><div class="chat-container"><div id="chat-messages"></div></div><button id="scroll-to-bottom-btn" title="Scroll to bottom">&darr;</button></main><div class="engine-modal-container"><div class="engine-content-wrapper"><button id="close-engine-btn" title="Close Settings">&times;</button><div class="engine-content"><div class="tab-pane" id="chats-pane"><div id="chat-sources-list"></div></div><div class="tab-pane" id="settings-pane"><div class="setting-item"><label data-i18n="languageLabel">Language</label><div id="language-selector" class="language-buttons"><button data-lang="en" class="active">EN</button> <button data-lang="pt">PT</button></div></div><div class="setting-item"><label for="font-size-slider" data-i18n="fontSizeLabel">Font Size</label> <span><span id="font-size-value">14</span>px</span> <input type="range" id="font-size-slider" min="10" max="24" value="14"></div><div class="setting-item"><label for="theme-toggle" data-i18n="darkModeLabel">Dark Mode</label> <label class="switch"><input type="checkbox" id="theme-toggle" checked="checked"> <span class="slider round"></span></label></div><div class="setting-item"><label for="centered-mode-toggle" data-i18n="centeredLayoutLabel">Centered Layout</label> <label class="switch"><input type="checkbox" id="centered-mode-toggle"> <span class="slider round"></span></label></div><div class="setting-item"><label for="channel-badges-toggle" data-i18n="showChannelPicturesLabel">Show Channel Icon</label> <label class="switch"><input type="checkbox" id="channel-badges-toggle"> <span class="slider round"></span></label></div><div class="setting-item"><label for="timestamps-toggle" data-i18n="showTimestampsLabel">Show Timestamps</label> <label class="switch"><input type="checkbox" id="timestamps-toggle"> <span class="slider round"></span></label></div><hr class="setting-divider"><div class="setting-item"><label for="highlight-mods-toggle" data-i18n="highlightModeratorsLabel">Highlight Moderators</label> <label class="switch"><input type="checkbox" id="highlight-mods-toggle"> <span class="slider round"></span></label></div><div class="setting-item"><label for="highlight-vips-toggle" data-i18n="highlightVipsLabel">Highlight VIPs</label> <label class="switch"><input type="checkbox" id="highlight-vips-toggle"> <span class="slider round"></span></label></div><div class="setting-item"><label for="highlight-subs-toggle" data-i18n="highlightSubscribersLabel">Highlight Subscribers</label> <label class="switch"><input type="checkbox" id="highlight-subs-toggle"> <span class="slider round"></span></label></div><hr class="setting-divider"><div class="setting-item"><label for="subs-only-toggle" data-i18n="subscribersOnlyLabel">Subscribers Only Mode</label> <label class="switch"><input type="checkbox" id="subs-only-toggle"> <span class="slider round"></span></label></div><div class="setting-item setting-item-full"><label for="proxy-url-input" data-i18n="proxyUrlLabel">Proxy URL</label> <input type="text" id="proxy-url-input" data-i18n-placeholder="proxyUrlPlaceholder" placeholder="https://your-proxy.com/"></div></div></div></div></div><footer class="engine-tabs-container"><div class="engine-tabs"><button class="tab-btn" data-tab="chats" data-i18n="chatsTab">Chats</button> <button class="tab-btn" data-tab="settings" data-i18n="settingsTab">Settings</button></div></footer><script src="static/app.min.js"></script></body></html>
